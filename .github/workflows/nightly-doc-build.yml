name: Nightly Documentation Build

on:
  schedule: # UTC at 0300
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: 3.14

jobs:
  nightly_docs_build:
    runs-on: ubuntu-22.04

    services:
      python-rest-server:
        image: ghcr.io/ansys/api-eigen-example/python-rest-server:latest
        ports:
          - 5000:5000
      python-grpc-server:
        image: ghcr.io/ansys/api-eigen-example/python-grpc-server:latest
        ports:
          - 50051:50051

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Install project requirements
        run: |
          sudo apt update
          sudo apt install cmake libeigen3-dev doxygen graphviz
          pip install -r requirements/requirements_eigen_wrapper.txt
          pip install src/ansys/eigen/cpp/eigen-wrapper
          pip install -r requirements/requirements_build.txt
          pip install .
          pip install -r requirements/requirements_docs.txt

      - name: Build documentation
        run: |
          make -C doc html

      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HTML-Documentation
          path: doc/_build/html
          retention-days: 7

      - name: Deploy documentation to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.github_token }}
          branch: gh-pages
          folder: doc/_build/html
          clean: true
          single-commit: true
